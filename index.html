<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every band I've seen live — Ryan Arnaudin</title>
<!-- No counts in the metadata on purpose: they would go stale on every data
     update, and this file is committed to a public repo while the show history
     is not. Live figures render from data.json into the masthead instead. -->
<meta name="description" content="Every band I've seen live, as a word cloud. Click any name for when and where — dates, venues, festivals, and who else was on the bill that night.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Every band I've seen live">
<meta property="og:description" content="Two decades of live music as a word cloud. Click any name for when and where.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<a class="skip" href="#search-input">Skip to search</a>

<canvas id="haze" aria-hidden="true"></canvas>

<header class="masthead">
  <h1>Bands I&rsquo;ve seen live</h1>
  <p class="stats">
    <span id="stats"></span>
    <button id="theme" class="chip" type="button" title="Switch theme (C)">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor"/>
      </svg>
      <span class="sr-only">Switch theme</span>
    </button>
    <button id="face" class="chip chip-face" type="button" title="Switch typeface (T)">
      <span aria-hidden="true">Aa</span>
      <span class="sr-only">Switch typeface</span>
    </button>
    <button id="shuffle" class="chip" type="button" title="Shuffle the layout (R)">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M13 4.5H9.2a3 3 0 0 0-2.4 1.2l-2.6 3.6A3 3 0 0 1 1.8 10.5H1M1 4.5h.8a3 3 0 0 1 2.4 1.2l.5.7M13 10.5H9.2a3 3 0 0 1-2.4-1.2l-.4-.6"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="m11.2 2.8 1.9 1.7-1.9 1.7M11.2 8.8l1.9 1.7-1.9 1.7"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sr-only">Shuffle the layout</span>
    </button>
  </p>
</header>

<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<main id="wall" class="wall" aria-label="Every band, sized by how many times seen"></main>

<div class="searchbar" role="search">
  <div class="search-shell">
    <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      id="search-input"
      type="text"
      role="combobox"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-expanded="false"
      aria-controls="search-results"
      aria-autocomplete="list"
      aria-label="Search bands, venues and festivals"
      placeholder="Search a band or venue">
    <kbd class="search-key" aria-hidden="true">/</kbd>
  </div>
  <ul id="search-results" class="results" role="listbox" aria-label="Search results" hidden></ul>
</div>

<div id="scrim" class="scrim" hidden></div>

<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
  <button id="panel-close" class="panel-close" type="button" aria-label="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="panel-body" class="panel-body"></div>
</aside>

<noscript>
  <p class="noscript">This page builds its word cloud in the browser, so it needs JavaScript.
  The underlying data is plain JSON at <a href="assets/data.json">assets/data.json</a>.</p>
</noscript>

<script type="module" src="assets/app.js"></script>
</body>
</html>
